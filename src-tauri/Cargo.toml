[package]
name = "bezgrow-erp"
version = "0.1.10"
description = "Bezgrow ERP desktop shell"
authors = ["Bezgrow"]
edition = "2021"

[lib]
name = "bezgrow_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["PDFDocument", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
