name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to package.json and must match it."
        required: false
        type: string
      platform:
        description: "Desktop platform to build. Publishing requires all; a single platform produces CI artifacts only."
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac
          - all
      release_channel:
        description: "auto uses trust status; stable requires platform signing."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - internal
          - stable
      signing:
        description: "auto signs when credentials exist; required fails without them."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - unsigned
          - required
      draft_release:
        description: "Create a draft GitHub Release without publishing website metadata."
        required: true
        default: false
        type: boolean
      publish:
        description: "Create a GitHub Release and publish verified download metadata."
        required: true
        default: true
        type: boolean
      release_notes:
        description: "Short public release note."
        required: false
        type: string
      minimum_supported_version:
        description: "Oldest installed Bezgrow version supported by the signed updater."
        required: false
        default: "0.1.0"
        type: string
      mandatory_after:
        description: "Optional ISO-8601 timestamp after which the first safe update opportunity is mandatory."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    name: Local-first release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prove local data authority, control-plane availability, persistence, and publication safety
        run: npm run test:release-gates

  mac:
    name: Build Mac DMG
    needs: release-gates
    if: >-
      needs.release-gates.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'mac')))
    runs-on: macos-14
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_DESKTOP_API_ORIGIN: ${{ vars.NEXT_PUBLIC_DESKTOP_API_ORIGIN || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY || secrets.NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY }}
      BEZGROW_MAC_SIGNING_IDENTITY: ${{ secrets.BEZGROW_MAC_SIGNING_IDENTITY }}
      BEZGROW_MAC_PROVIDER_SHORT_NAME: ${{ secrets.BEZGROW_MAC_PROVIDER_SHORT_NAME }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      BEZGROW_UPDATER_PUBLIC_KEY: ${{ vars.BEZGROW_UPDATER_PUBLIC_KEY || secrets.BEZGROW_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci
      - run: npm run icons:generate
      - run: npm run desktop:validate-env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the secret-free production web bundle
        run: npm run build
        env:
          BEZGROW_DESKTOP_BUILD: "1"
          SUPABASE_SERVICE_ROLE_KEY: ""
          BEZGROW_LICENSE_PRIVATE_KEY: ""
      - name: Check and test Rust sources on macOS
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Resolve Mac signing and notarization mode
        id: trust
        shell: bash
        run: |
          HAS_SIGNING=false
          HAS_NOTARY=false
          HAS_UPDATER=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/bezgrow-signing-validation.p12"
            VALIDATION_KEYCHAIN="$RUNNER_TEMP/bezgrow-signing-validation.keychain-db"
            VALIDATION_PASSWORD="$(openssl rand -hex 24)"
            if printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$CERTIFICATE_PATH" 2>/dev/null &&
               security create-keychain -p "$VALIDATION_PASSWORD" "$VALIDATION_KEYCHAIN" >/dev/null 2>&1 &&
               security unlock-keychain -p "$VALIDATION_PASSWORD" "$VALIDATION_KEYCHAIN" >/dev/null 2>&1 &&
               security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -k "$VALIDATION_KEYCHAIN" >/dev/null 2>&1; then
              HAS_SIGNING=true
            else
              echo "The configured Apple certificate is not an importable PKCS#12 identity. Building an explicitly labelled internal DMG instead." >> "$GITHUB_STEP_SUMMARY"
            fi
            security delete-keychain "$VALIDATION_KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH"
          elif [ -n "$BEZGROW_MAC_SIGNING_IDENTITY" ] &&
               security find-identity -v -p codesigning | grep -Fq "$BEZGROW_MAC_SIGNING_IDENTITY"; then
            HAS_SIGNING=true
          fi
          if { [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; } ||
             { [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_PATH" ]; }; then
            HAS_NOTARY=true
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$BEZGROW_UPDATER_PUBLIC_KEY" ]; then
            HAS_UPDATER=true
          fi
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ] && [ "$HAS_UPDATER" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "Apple or updater signing credentials are incomplete. The DMG will be labelled internal/testing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Mac installer
        shell: bash
        run: |
          if [ "${{ steps.trust.outputs.notarized }}" = "true" ]; then
            npm run desktop:build:mac:public
          else
            env \
              -u BEZGROW_MAC_SIGNING_IDENTITY \
              -u BEZGROW_MAC_PROVIDER_SHORT_NAME \
              -u APPLE_CERTIFICATE \
              -u APPLE_CERTIFICATE_PASSWORD \
              -u APPLE_ID \
              -u APPLE_PASSWORD \
              -u APPLE_TEAM_ID \
              -u APPLE_API_KEY \
              -u APPLE_API_ISSUER \
              -u APPLE_API_KEY_PATH \
              -u TAURI_SIGNING_PRIVATE_KEY \
              -u TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
              -u BEZGROW_UPDATER_PUBLIC_KEY \
              npm run desktop:build:mac
          fi

      - name: Verify and stage Mac installer
        shell: bash
        run: |
          APP_BINARY="src-tauri/target/release/Bezgrow"
          if [ ! -f "$APP_BINARY" ]; then
            echo "The built macOS application binary was not found."
            exit 1
          fi
          DMG="$(find src-tauri/target/release/bundle/dmg -type f -name 'Bezgrow_*.dmg' -print -quit)"
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "The newly built macOS DMG was not found."
            exit 1
          fi
          ARCHS="$(lipo -archs "$APP_BINARY")"
          case "$ARCHS" in
            arm64) RELEASE_ARCHITECTURE="arm64" ;;
            x86_64) RELEASE_ARCHITECTURE="x64" ;;
            *)
              echo "Unsupported or multi-architecture Mac artifact: $ARCHS"
              exit 1
              ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          DMG_NAME="Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.dmg"
          mkdir -p release-artifacts
          cp "$DMG" "release-artifacts/$DMG_NAME"
          DMG_SHA="$(shasum -a 256 "release-artifacts/$DMG_NAME" | awk '{print $1}')"
          DMG_BYTES="$(stat -f '%z' "release-artifacts/$DMG_NAME")"
          BUILD_IDENTITY="desktop-runtime/next-server/public/desktop-build.json"
          if [ ! -f "$BUILD_IDENTITY" ]; then
            echo "The embedded desktop build identity is missing."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const [identityPath, outputPath, artifactFilename, artifactSha, artifactBytes, architecture, sourceCommit] = process.argv.slice(1);
            const identity = JSON.parse(fs.readFileSync(identityPath, "utf8"));
            if (identity.gitCommit !== sourceCommit) throw new Error(`Embedded commit ${identity.gitCommit} does not match ${sourceCommit}.`);
            if (identity.sourceTreeDirty !== false) throw new Error("Release builds must come from a clean source tree.");
            fs.writeFileSync(outputPath, JSON.stringify({
              version: identity.applicationVersion,
              sourceCommit,
              builtAt: identity.builtAt,
              sourceTreeDirty: identity.sourceTreeDirty,
              platform: "macos",
              architecture,
              artifact: { filename: artifactFilename, bytes: Number(artifactBytes), sha256: artifactSha },
            }, null, 2) + "\n");
          ' "$BUILD_IDENTITY" release-artifacts/mac-build.json "$DMG_NAME" "$DMG_SHA" "$DMG_BYTES" "$RELEASE_ARCHITECTURE" "$GITHUB_SHA"

          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$MOUNT_DIR" "release-artifacts/$DMG_NAME"
          trap 'hdiutil detach -quiet "$MOUNT_DIR" || true; rmdir "$MOUNT_DIR" || true' EXIT
          BUNDLED_APP="$MOUNT_DIR/Bezgrow.app"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUNDLED_APP/Contents/Info.plist")"
          if [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "Mounted bundle version $BUNDLE_VERSION does not match $VERSION."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const [identityPath, expectedVersion, expectedCommit] = process.argv.slice(1);
            const identity = JSON.parse(fs.readFileSync(identityPath, "utf8"));
            if (identity.applicationVersion !== expectedVersion || identity.gitCommit !== expectedCommit || Number.isNaN(Date.parse(identity.builtAt)) || identity.sourceTreeDirty !== false) {
              throw new Error("Mounted app build identity does not match the release source.");
            }
          ' "$BUNDLED_APP/Contents/Resources/next-server/public/desktop-build.json" "$VERSION" "$GITHUB_SHA"
          if grep -R -a -q 'Create secure share link' "$BUNDLED_APP/Contents/Resources/next-server"; then
            echo "Mounted app still contains the obsolete secure-share modal."
            exit 1
          fi
          grep -R -a -q 'Automatic mode sends only this explicitly selected invoice PDF' "$BUNDLED_APP/Contents/Resources/next-server"
          grep -a -q 'desktop_open_pdf_for_print' "$BUNDLED_APP/Contents/MacOS/Bezgrow"
          hdiutil detach -quiet "$MOUNT_DIR"
          rmdir "$MOUNT_DIR"
          trap - EXIT

          if [ "${{ steps.trust.outputs.updater }}" = "true" ]; then
            UPDATER="$(find src-tauri/target/release/bundle/macos -type f -name '*.app.tar.gz' -print -quit)"
            if [ -z "$UPDATER" ] || [ ! -f "$UPDATER.sig" ]; then
              echo "The signed macOS updater archive or signature is missing."
              exit 1
            fi
            cp "$UPDATER" "release-artifacts/Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.app.tar.gz"
            cp "$UPDATER.sig" "release-artifacts/Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.app.tar.gz.sig"
            UPDATER_SHA="$(shasum -a 256 "release-artifacts/Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.app.tar.gz" | awk '{print $1}')"
            node --import tsx scripts/verify-updater-signature.ts \
              --file "release-artifacts/Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.app.tar.gz" \
              --signature "release-artifacts/Bezgrow-${VERSION}-${RELEASE_ARCHITECTURE}.app.tar.gz.sig" \
              --sha256 "$UPDATER_SHA"
          fi
          echo "$RELEASE_ARCHITECTURE" > release-artifacts/mac-architecture.txt
          echo "${{ steps.trust.outputs.signed }}" > release-artifacts/mac-signing-status.txt
          echo "${{ steps.trust.outputs.notarized }}" > release-artifacts/mac-notarization-status.txt
          echo "${{ steps.trust.outputs.updater }}" > release-artifacts/mac-updater-status.txt
          node scripts/verify-release-artifact.mjs \
            --file "release-artifacts/$DMG_NAME" \
            --platform macos \
            --architecture "$RELEASE_ARCHITECTURE" \
            --version "$(node -p "require('./package.json').version")"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: release-gates
    if: >-
      needs.release-gates.result == 'success' &&
      (github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows')
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_DESKTOP_API_ORIGIN: ${{ vars.NEXT_PUBLIC_DESKTOP_API_ORIGIN || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL || 'https://www.bezgrow.com' }}
      NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY || secrets.NEXT_PUBLIC_BEZGROW_LICENSE_PUBLIC_KEY }}
      BEZGROW_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 || secrets.BEZGROW_WINDOWS_CERTIFICATE_BASE64 }}
      BEZGROW_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.BEZGROW_WINDOWS_CERTIFICATE_PASSWORD }}
      BEZGROW_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || secrets.BEZGROW_WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      BEZGROW_DESKTOP_TARGET: x86_64-pc-windows-msvc
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      BEZGROW_UPDATER_PUBLIC_KEY: ${{ vars.BEZGROW_UPDATER_PUBLIC_KEY || secrets.BEZGROW_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
          cache-on-failure: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - run: npm ci
      - run: npm run icons:generate
      - run: npm run desktop:validate-env

      - name: Install Windows packaging prerequisites
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makeNsis = Join-Path $nsisDirectory "makensis.exe"
          if (-not (Test-Path -LiteralPath $makeNsis)) {
            throw "Chocolatey completed, but makensis.exe is missing from $nsisDirectory."
          }
          $nsisDirectory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows build prerequisites
        shell: pwsh
        run: |
          foreach ($command in @("cl.exe", "link.exe", "msbuild.exe", "makensis.exe")) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required Windows build tool is unavailable: $command"
            }
          }
          $webViewClient = Get-ItemProperty `
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F1E7E3F5-3F4C-4A6D-8B11-8A1B7A9D5F4A}", `
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*" `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.name -match "WebView2" } |
            Select-Object -First 1
          if ($webViewClient) {
            "WebView2 runtime detected on the build runner." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "WebView2 runtime was not detected in the runner registry. The configured offline installer remains bundled." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the secret-free production desktop bundle
        run: npm run build
        env:
          BEZGROW_DESKTOP_BUILD: "1"
          SUPABASE_SERVICE_ROLE_KEY: ""
          BEZGROW_LICENSE_PRIVATE_KEY: ""

      - name: Download the bundled x64 Node runtime
        shell: pwsh
        run: |
          $nodeVersion = node -p "process.versions.node"
          $archiveName = "node-v$nodeVersion-win-x64"
          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/v$nodeVersion/$archiveName.zip" `
            -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force
          $nodeBinary = Join-Path $env:RUNNER_TEMP "$archiveName\node.exe"
          if (-not (Test-Path -LiteralPath $nodeBinary)) {
            throw "The native x64 Node runtime was not downloaded."
          }
          "BEZGROW_DESKTOP_NODE_BINARY=$nodeBinary" >> $env:GITHUB_ENV

      - name: Prepare bundled Next.js server
        run: npm run desktop:prepare

      - name: Check and test Rust sources on the Windows x64 target
        shell: pwsh
        run: |
          cargo fmt --check --manifest-path src-tauri\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri\Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve Windows signing mode
        id: signing
        shell: pwsh
        env:
          REQUESTED_SIGNING: ${{ inputs.signing }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel }}
        run: |
          $requestedSigning = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_SIGNING)) { "auto" } else { $env:REQUESTED_SIGNING }
          $requestedChannel = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_CHANNEL)) { "auto" } else { $env:REQUESTED_CHANNEL }
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_PASSWORD)
          $hasUpdater = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -and -not [string]::IsNullOrWhiteSpace($env:BEZGROW_UPDATER_PUBLIC_KEY)
          if ($hasCertificate -ne $hasPassword) {
            throw "Windows signing configuration is incomplete: both certificate and password are required."
          }
          if ($requestedSigning -eq "unsigned") {
            if ($requestedChannel -eq "stable") {
              throw "A stable release cannot explicitly request an unsigned build."
            }
            "status=unsigned" >> $env:GITHUB_OUTPUT
            "Windows build intentionally requested as unsigned internal/testing." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          if (-not $hasCertificate) {
            if ($requestedSigning -eq "required" -or $requestedChannel -eq "stable") {
              throw "Windows Authenticode credentials are required for the requested release mode."
            }
            "status=unsigned" >> $env:GITHUB_OUTPUT
            "Windows Authenticode credentials are unavailable; producing a genuine unsigned internal/testing build." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          if (-not $hasUpdater) {
            if ($requestedSigning -eq "required" -or $requestedChannel -eq "stable") {
              throw "Stable Windows publication requires the Tauri updater private key and public key."
            }
            "status=unsigned" >> $env:GITHUB_OUTPUT
            "Windows updater signing credentials are unavailable; producing an internal/testing build without updater metadata." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "bezgrow-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:BEZGROW_WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:BEZGROW_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password
          if (-not $certificate.Thumbprint) {
            throw "The Windows signing certificate could not be imported."
          }
          "BEZGROW_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "BEZGROW_WINDOWS_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
          "status=valid" >> $env:GITHUB_OUTPUT

      - name: Build NSIS, MSI, native, and portable Windows artifacts
        shell: pwsh
        env:
          BEZGROW_DESKTOP_PREPARED: "1"
        run: |
          $arguments = @(
            "scripts/build-desktop.mjs",
            "--bundles", "msi,nsis",
            "--target", "x86_64-pc-windows-msvc"
          )
          if ("${{ steps.signing.outputs.status }}" -eq "valid") {
            $arguments += "--public-windows"
          }
          & node $arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled server startup and shutdown
        run: node scripts/test-desktop-startup.mjs

      - name: Verify install, launch, local route, SQLite, shutdown, update, and reinstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\Bezgrow_*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          .\scripts\test-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Upload installed-app smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-app-diagnostics
          path: ${{ runner.temp }}/bezgrow-installer-smoke/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage and validate genuine Windows artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $bundleRoot = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $releaseRoot = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $nsis = Get-ChildItem "$bundleRoot\nsis\Bezgrow_*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$bundleRoot\msi\Bezgrow_*.msi" | Select-Object -First 1
          $portableExe = Get-Item "$bundleRoot\portable\Bezgrow-windows-x64-portable.exe"
          $portableZip = Get-Item "$bundleRoot\portable\Bezgrow-windows-x64-portable.zip"
          $nativeExe = Get-Item "$releaseRoot\Bezgrow.exe"
          foreach ($artifact in @($nsis, $msi, $portableExe, $portableZip, $nativeExe)) {
            if (-not $artifact) { throw "A required Windows artifact is missing." }
          }
          $peHeaders = (& dumpbin.exe /headers $nativeExe.FullName | Out-String)
          if ($peHeaders -notmatch "subsystem \(Windows GUI\)") {
            throw "Bezgrow.exe was not linked with the Windows GUI subsystem."
          }

          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $staged = [ordered]@{
            nsis = "release-artifacts\Bezgrow-${version}-windows-x64-setup.exe"
            msi = "release-artifacts\Bezgrow-${version}-windows-x64.msi"
            native = "release-artifacts\Bezgrow-${version}-windows-x64.exe"
            portable = "release-artifacts\Bezgrow-${version}-x64-portable.exe"
            portableZip = "release-artifacts\Bezgrow-${version}-x64-portable.zip"
          }
          Copy-Item -LiteralPath $nsis.FullName -Destination $staged.nsis
          Copy-Item -LiteralPath $msi.FullName -Destination $staged.msi
          Copy-Item -LiteralPath $nativeExe.FullName -Destination $staged.native
          Copy-Item -LiteralPath $portableExe.FullName -Destination $staged.portable
          Copy-Item -LiteralPath $portableZip.FullName -Destination $staged.portableZip

          foreach ($path in @($staged.nsis, $staged.msi, $staged.native, $staged.portable)) {
            node scripts/verify-release-artifact.mjs `
              --file $path `
              --platform windows `
              --architecture x64 `
              --version $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $signed = "${{ steps.signing.outputs.status }}" -eq "valid"
          $updaterVerified = $false
          if ($signed) {
            foreach ($path in @($staged.nsis, $staged.msi, $staged.native, $staged.portable)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne "Valid") {
                throw "Authenticode verification failed for $path with status $($signature.Status)."
              }
            }
            $nsisSignature = "$($nsis.FullName).sig"
            if (-not (Test-Path -LiteralPath $nsisSignature)) {
              throw "The signed Windows updater signature is missing: $nsisSignature"
            }
            $stagedSignature = "$($staged.nsis).sig"
            Copy-Item -LiteralPath $nsisSignature -Destination $stagedSignature
            $updaterSha = (Get-FileHash -LiteralPath $staged.nsis -Algorithm SHA256).Hash.ToLowerInvariant()
            node --import tsx scripts/verify-updater-signature.ts `
              --file $staged.nsis `
              --signature $stagedSignature `
              --sha256 $updaterSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $updaterVerified = $true
          }
          "${{ steps.signing.outputs.status }}" | Set-Content "release-artifacts\windows-signing-status.txt"
          $updaterVerified.ToString().ToLowerInvariant() | Set-Content "release-artifacts\windows-updater-status.txt"

          $records = foreach ($entry in $staged.GetEnumerator()) {
            $item = Get-Item -LiteralPath $entry.Value
            [ordered]@{
              kind = $entry.Key
              filename = $item.Name
              bytes = $item.Length
              sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              signed = $signed -and $entry.Key -ne "portableZip"
            }
          }
          [ordered]@{
            version = $version
            platform = "windows"
            architecture = "x86_64"
            buildCommit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            workflowRunNumber = "${{ github.run_number }}"
            updaterSignatureVerified = $updaterVerified
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            artifacts = $records
          } | ConvertTo-Json -Depth 8 | Set-Content "release-artifacts\windows-build.json"

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Get-ChildItem "Cert:\CurrentUser\My\$env:BEZGROW_WINDOWS_CERTIFICATE_THUMBPRINT" `
              -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:BEZGROW_WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Installers And Download Metadata
    runs-on: ubuntu-latest
    needs:
      - mac
      - windows
    if: >-
      always() &&
      !cancelled() &&
      needs.mac.result == 'success' &&
      needs.windows.result == 'success' &&
      (github.event_name == 'push' ||
      (inputs.publish == true && inputs.platform == 'all'))
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Compute release checksums
        shell: bash
        run: |
          find release-artifacts -type f ! -name 'SHA256SUMS.txt' -print0 |
            sort -z |
            xargs -0 sha256sum > release-artifacts/SHA256SUMS.txt

      - name: Verify genuine publication inputs
        shell: bash
        run: |
          node scripts/verify-release-publication-inputs.mjs \
            --root release-artifacts \
            --checksums release-artifacts/SHA256SUMS.txt \
            --version "$(node -p "require('./package.json').version")"

      - name: Resolve release identity and policy
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${{ inputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -z "$VERSION" ]; then
            VERSION="$PACKAGE_VERSION"
          fi
          VERSION="${VERSION#v}"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested release version $VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          TRUSTED=true
          if [ -f "release-artifacts/mac/mac-signing-status.txt" ]; then
            MAC_SIGNED="$(tr -d '\r\n' < release-artifacts/mac/mac-signing-status.txt)"
            MAC_NOTARIZED="$(tr -d '\r\n' < release-artifacts/mac/mac-notarization-status.txt)"
            MAC_UPDATER="$(tr -d '\r\n' < release-artifacts/mac/mac-updater-status.txt)"
            if [ "$MAC_SIGNED" != "true" ] || [ "$MAC_NOTARIZED" != "true" ] || [ "$MAC_UPDATER" != "true" ]; then
              TRUSTED=false
            fi
          fi
          if [ -f "release-artifacts/windows-x64/windows-signing-status.txt" ]; then
            WINDOWS_SIGNING="$(tr -d '\r\n' < release-artifacts/windows-x64/windows-signing-status.txt)"
            WINDOWS_UPDATER="$(tr -d '\r\n' < release-artifacts/windows-x64/windows-updater-status.txt)"
            if [ "$WINDOWS_SIGNING" != "valid" ] || [ "$WINDOWS_UPDATER" != "true" ]; then
              TRUSTED=false
            fi
          fi

          REQUESTED_CHANNEL="${{ inputs.release_channel }}"
          if [ -z "$REQUESTED_CHANNEL" ]; then REQUESTED_CHANNEL="auto"; fi
          if [ "$REQUESTED_CHANNEL" = "stable" ] && [ "$TRUSTED" != "true" ]; then
            echo "Stable publication was requested, but one or more artifacts are not platform-trusted."
            exit 1
          fi
          if [ "$REQUESTED_CHANNEL" = "internal" ]; then
            CHANNEL="internal"
          elif [ "$TRUSTED" = "true" ]; then
            CHANNEL="stable"
          else
            CHANNEL="internal"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            DRAFT=false
          elif [ "$CHANNEL" = "stable" ]; then
            TAG="v$VERSION"
            DRAFT="${{ inputs.draft_release }}"
          else
            TAG="v$VERSION-internal.${{ github.run_number }}"
            DRAFT="${{ inputs.draft_release }}"
          fi
          if [ "$CHANNEL" = "stable" ]; then PRERELEASE=false; else PRERELEASE=true; fi
          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Bezgrow $VERSION desktop release with integrity-verified installers."
          fi
          MINIMUM_VERSION="${{ inputs.minimum_supported_version }}"
          if [ -z "$MINIMUM_VERSION" ]; then MINIMUM_VERSION="0.1.0"; fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "minimum_version=$MINIMUM_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<BEZGROW_NOTES"
            echo "$NOTES"
            echo "BEZGROW_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          FLAGS=()
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi
          if [ "${{ steps.release.outputs.draft }}" = "true" ]; then FLAGS+=(--draft); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Bezgrow $VERSION (${{ steps.release.outputs.channel }})" \
              --notes "${{ steps.release.outputs.notes }}" \
              "${FLAGS[@]}"
          fi
          mapfile -d '' ASSETS < <(
            find release-artifacts -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.msix' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.sig' -o -name 'SHA256SUMS.txt' -o -name '*-build.json' \) \
              -print0
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No genuine release assets were downloaded."
            exit 1
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - name: Write verified website release metadata
        if: steps.release.outputs.draft != 'true'
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BASE_URL="https://github.com/$REPOSITORY/releases/download/$TAG"
          MANIFEST_ARGS=(
            --version "$VERSION"
            --replace "true"
            --channel "${{ steps.release.outputs.channel }}"
            --release-notes "${{ steps.release.outputs.notes }}"
            --minimum-supported-version "${{ steps.release.outputs.minimum_version }}"
            --minimum-supported-windows-version "Windows 10 version 1809 (64-bit)"
            --mandatory-after "${{ inputs.mandatory_after }}"
            --publication-status "published"
            --updater-compatibility "tauri-v2"
            --build-commit "${{ github.sha }}"
            --workflow-run-id "${{ github.run_id }}"
          )

          MAC_DMG="$(find release-artifacts/mac -maxdepth 1 -name "Bezgrow-${VERSION}-*.dmg" -print -quit 2>/dev/null || true)"
          if [ -n "$MAC_DMG" ] && [ -f "$MAC_DMG" ]; then
            MAC_ARCHITECTURE="$(cat release-artifacts/mac/mac-architecture.txt)"
            MAC_DMG_NAME="$(basename "$MAC_DMG")"
            MAC_SIGNED="$(tr -d '\r\n' < release-artifacts/mac/mac-signing-status.txt)"
            MAC_NOTARIZED="$(tr -d '\r\n' < release-artifacts/mac/mac-notarization-status.txt)"
            MAC_BUILD_TIMESTAMP="$(node -p "require('./release-artifacts/mac/mac-build.json').builtAt")"
            MAC_CHANNEL="internal"
            if [ "$MAC_SIGNED" = "true" ] && [ "$MAC_NOTARIZED" = "true" ]; then MAC_CHANNEL="stable"; fi
            MANIFEST_ARGS+=(
              --mac-url "$BASE_URL/$MAC_DMG_NAME"
              --mac-file "$MAC_DMG"
              --mac-filename "$MAC_DMG_NAME"
              --mac-architecture "$MAC_ARCHITECTURE"
              --mac-signed "$MAC_SIGNED"
              --mac-notarized "$MAC_NOTARIZED"
              --mac-channel "$MAC_CHANNEL"
              --mac-installer-type "dmg"
              --mac-build-timestamp "$MAC_BUILD_TIMESTAMP"
            )
            MAC_UPDATER="$(find release-artifacts/mac -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
            if [ -n "$MAC_UPDATER" ]; then
              MAC_UPDATER_NAME="$(basename "$MAC_UPDATER")"
              MANIFEST_ARGS+=(
                --mac-updater-url "$BASE_URL/$MAC_UPDATER_NAME"
                --mac-updater-file "$MAC_UPDATER"
                --mac-update-signature-file "$MAC_UPDATER.sig"
                --mac-updater-signature-verified "true"
              )
            fi
          fi

          WINDOWS_DIR="release-artifacts/windows-x64"
          if [ -d "$WINDOWS_DIR" ]; then
            WINDOWS_SIGNING="$(tr -d '\r\n' < "$WINDOWS_DIR/windows-signing-status.txt")"
            WINDOWS_SIGNED=false
            WINDOWS_CHANNEL="internal"
            if [ "$WINDOWS_SIGNING" = "valid" ]; then
              WINDOWS_SIGNED=true
              WINDOWS_CHANNEL="stable"
            fi
            WINDOWS_EXE="$(find "$WINDOWS_DIR" -maxdepth 1 -name 'Bezgrow-*-windows-x64-setup.exe' -print -quit)"
            WINDOWS_MSI="$(find "$WINDOWS_DIR" -maxdepth 1 -name 'Bezgrow-*-windows-x64.msi' -print -quit)"
            WINDOWS_PORTABLE="$(find "$WINDOWS_DIR" -maxdepth 1 -name 'Bezgrow-*-x64-portable.exe' -print -quit)"
            WINDOWS_PORTABLE_ZIP="$(find "$WINDOWS_DIR" -maxdepth 1 -name 'Bezgrow-*-x64-portable.zip' -print -quit)"
            if [ -z "$WINDOWS_EXE" ] || [ -z "$WINDOWS_MSI" ]; then
              echo "The required Windows NSIS and MSI artifacts are missing."
              exit 1
            fi
            WINDOWS_EXE_NAME="$(basename "$WINDOWS_EXE")"
            WINDOWS_MSI_NAME="$(basename "$WINDOWS_MSI")"
            MANIFEST_ARGS+=(
              --windows-url "$BASE_URL/$WINDOWS_EXE_NAME"
              --windows-file "$WINDOWS_EXE"
              --windows-filename "$WINDOWS_EXE_NAME"
              --windows-signed "$WINDOWS_SIGNED"
              --windows-channel "$WINDOWS_CHANNEL"
              --windows-installer-type "nsis"
              --windows-msi-url "$BASE_URL/$WINDOWS_MSI_NAME"
              --windows-msi-file "$WINDOWS_MSI"
              --windows-msi-filename "$WINDOWS_MSI_NAME"
              --windows-msi-signed "$WINDOWS_SIGNED"
              --windows-msi-channel "$WINDOWS_CHANNEL"
              --windows-msi-installer-type "msi"
            )
            if [ -f "$WINDOWS_EXE.sig" ]; then
              MANIFEST_ARGS+=(
                --windows-updater-url "$BASE_URL/$WINDOWS_EXE_NAME"
                --windows-updater-file "$WINDOWS_EXE"
                --windows-update-signature-file "$WINDOWS_EXE.sig"
                --windows-updater-signature-verified "true"
              )
            fi
            if [ -n "$WINDOWS_PORTABLE" ]; then
              WINDOWS_PORTABLE_NAME="$(basename "$WINDOWS_PORTABLE")"
              MANIFEST_ARGS+=(
                --windows-portable-url "$BASE_URL/$WINDOWS_PORTABLE_NAME"
                --windows-portable-file "$WINDOWS_PORTABLE"
                --windows-portable-filename "$WINDOWS_PORTABLE_NAME"
                --windows-portable-signed "$WINDOWS_SIGNED"
                --windows-portable-channel "$WINDOWS_CHANNEL"
                --windows-portable-installer-type "portable-exe"
              )
            fi
            if [ -n "$WINDOWS_PORTABLE_ZIP" ]; then
              WINDOWS_PORTABLE_ZIP_NAME="$(basename "$WINDOWS_PORTABLE_ZIP")"
              MANIFEST_ARGS+=(
                --windows-portable-zip-url "$BASE_URL/$WINDOWS_PORTABLE_ZIP_NAME"
                --windows-portable-zip-file "$WINDOWS_PORTABLE_ZIP"
                --windows-portable-zip-filename "$WINDOWS_PORTABLE_ZIP_NAME"
                --windows-portable-zip-signed "false"
                --windows-portable-zip-channel "$WINDOWS_CHANNEL"
                --windows-portable-zip-installer-type "portable-zip"
              )
            fi
          fi
          node scripts/write-desktop-release-manifest.mjs "${MANIFEST_ARGS[@]}"

      - name: Publish control-plane release metadata
        if: steps.release.outputs.draft != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase publication secrets are unavailable. GitHub release URLs and checked-in website metadata were still published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PUBLISH_PLATFORM="all"
          if [ -d "release-artifacts/windows-x64" ] && [ ! -d "release-artifacts/mac" ]; then
            PUBLISH_PLATFORM="windows"
          elif [ -d "release-artifacts/mac" ] && [ ! -d "release-artifacts/windows-x64" ]; then
            PUBLISH_PLATFORM="macos"
          fi
          node scripts/publish-release-metadata.mjs \
            --manifest public/downloads/desktop-release.json \
            --version "${{ steps.release.outputs.version }}" \
            --build-number "${{ github.run_number }}" \
            --channel "${{ steps.release.outputs.channel }}" \
            --platform "$PUBLISH_PLATFORM"

      - name: Commit website release metadata
        if: steps.release.outputs.draft != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          METADATA_FILES=(
            public/downloads/desktop-release.json
            public/downloads/Bezgrow-mac.dmg.release.json
            public/downloads/Bezgrow-windows.exe.release.json
            public/downloads/Bezgrow-windows.msi.release.json
          )
          for METADATA_FILE in "${METADATA_FILES[@]}"; do
            if [ -f "$METADATA_FILE" ]; then git add "$METADATA_FILE"; fi
          done
          if git diff --cached --quiet; then
            echo "Website release metadata is already up to date."
            exit 0
          fi
          git commit -m "Publish desktop release ${{ steps.release.outputs.version }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Verify production Windows metadata and binary endpoint
        if: steps.release.outputs.draft != 'true' && needs.windows.result == 'success'
        run: >-
          node scripts/verify-production-windows-download.mjs
          --site https://www.bezgrow.com
          --version "${{ steps.release.outputs.version }}"
          --attempts 40
          --interval-ms 15000

  verify-production-mac:
    name: Verify Production Mac Download
    runs-on: macos-14
    needs:
      - mac
      - publish
    if: >-
      always() &&
      !cancelled() &&
      needs.mac.result == 'success' &&
      needs.publish.result == 'success'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download, mount, and inspect the exact production Mac artifact
        run: >-
          node scripts/verify-production-mac-download.mjs
          --site https://www.bezgrow.com
          --version "$(node -p "require('./package.json').version")"
          --commit "${{ github.sha }}"
          --attempts 40
          --interval-ms 15000
