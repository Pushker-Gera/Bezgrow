name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0. Defaults to package.json."
        required: false
        type: string
      platform:
        description: "Desktop platform to build and publish."
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - mac

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  mac:
    name: Build Mac DMG
    if: inputs.platform == 'all' || inputs.platform == 'mac'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      BEZGROW_MAC_SIGNING_IDENTITY: ${{ secrets.BEZGROW_MAC_SIGNING_IDENTITY }}
      BEZGROW_MAC_PROVIDER_SHORT_NAME: ${{ secrets.BEZGROW_MAC_PROVIDER_SHORT_NAME }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - run: npm run lint

      - name: Resolve Mac signing and notarization mode
        id: trust
        shell: bash
        run: |
          HAS_SIGNING=false
          HAS_NOTARY=false
          if [ -n "$BEZGROW_MAC_SIGNING_IDENTITY" ] || { [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; }; then
            HAS_SIGNING=true
          fi
          if { [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; } ||
             { [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_PATH" ]; }; then
            HAS_NOTARY=true
          fi
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "channel=internal" >> "$GITHUB_OUTPUT"
            echo "Apple signing or notarization credentials are incomplete. The DMG will still be built and published as internal/testing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Mac installer
        shell: bash
        run: |
          if [ "${{ steps.trust.outputs.notarized }}" = "true" ]; then
            npm run desktop:build:mac:public
          else
            npm run desktop:build:mac
          fi

      - name: Record verified Mac artifact architecture
        shell: bash
        run: |
          APP_BINARY="$(find src-tauri/target/release/bundle/macos -type f -path '*/Contents/MacOS/*' -perm -111 | head -n 1)"
          if [ -z "$APP_BINARY" ]; then
            echo "The built macOS application binary was not found."
            exit 1
          fi
          ARCHS="$(lipo -archs "$APP_BINARY")"
          case "$ARCHS" in
            arm64) RELEASE_ARCHITECTURE="arm64" ;;
            x86_64) RELEASE_ARCHITECTURE="x64" ;;
            *)
              echo "Unsupported or multi-architecture Mac artifact: $ARCHS"
              exit 1
              ;;
          esac
          echo "$RELEASE_ARCHITECTURE" > mac-architecture.txt

      - name: Verify and stage Mac installer
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp public/downloads/Bezgrow-mac.dmg release-artifacts/Bezgrow-mac.dmg
          cp public/downloads/Bezgrow-mac.dmg.release.json release-artifacts/Bezgrow-mac.dmg.release.json
          cp mac-architecture.txt release-artifacts/mac-architecture.txt
          echo "${{ steps.trust.outputs.signed }}" > release-artifacts/mac-signing-status.txt
          echo "${{ steps.trust.outputs.notarized }}" > release-artifacts/mac-notarization-status.txt
          node scripts/verify-release-artifact.mjs \
            --file release-artifacts/Bezgrow-mac.dmg \
            --platform macos \
            --architecture "$(cat mac-architecture.txt)" \
            --version "$(node -p "require('./package.json').version")"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows ${{ matrix.arch }}
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            nodeArchive: win-x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            nodeArchive: win-arm64
    env:
      BEZGROW_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.BEZGROW_WINDOWS_CERTIFICATE_BASE64 }}
      BEZGROW_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.BEZGROW_WINDOWS_CERTIFICATE_PASSWORD }}
      BEZGROW_WINDOWS_TIMESTAMP_URL: ${{ secrets.BEZGROW_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Resolve Windows signing mode
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:BEZGROW_WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Windows signing configuration is incomplete: both certificate and password secrets are required."
          }
          if (-not $hasCertificate) {
            "status=unsigned" >> $env:GITHUB_OUTPUT
            "Windows Authenticode credentials are unavailable; building an unsigned workflow artifact only." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "bezgrow-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:BEZGROW_WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:BEZGROW_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password
          if (-not $certificate.Thumbprint) {
            throw "The Windows signing certificate could not be imported."
          }
          "BEZGROW_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "status=valid" >> $env:GITHUB_OUTPUT

      - name: Download target Node runtime
        shell: pwsh
        run: |
          $nodeVersion = node -p "process.versions.node"
          $archiveName = "node-v$nodeVersion-${{ matrix.nodeArchive }}"
          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/v$nodeVersion/$archiveName.zip" `
            -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force
          $nodeBinary = Join-Path $env:RUNNER_TEMP "$archiveName\node.exe"
          if (-not (Test-Path -LiteralPath $nodeBinary)) {
            throw "Target Node runtime was not downloaded."
          }
          "BEZGROW_DESKTOP_NODE_BINARY=$nodeBinary" >> $env:GITHUB_ENV

      - name: Build installers and portable releases
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/build-desktop.mjs",
            "--bundles", "msi,nsis",
            "--target", "${{ matrix.target }}"
          )
          if ("${{ steps.signing.outputs.status }}" -eq "valid") {
            $arguments += "--public-windows"
          }
          & node $arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify desktop startup budget
        if: matrix.arch == 'x64'
        run: node scripts/test-desktop-startup.mjs

      - name: Verify clean install, update, uninstall, and data preservation
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Bezgrow_*.exe" |
            Select-Object -First 1
          .\scripts\test-windows-installer.ps1 -InstallerPath $installer.FullName

      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $bundleRoot = "src-tauri\target\${{ matrix.target }}\release\bundle"
          Copy-Item "$bundleRoot\nsis\Bezgrow_*.exe" "release-artifacts\Bezgrow-windows-${{ matrix.arch }}-setup.exe"
          Copy-Item "$bundleRoot\msi\Bezgrow_*.msi" "release-artifacts\Bezgrow-windows-${{ matrix.arch }}.msi"
          Copy-Item "$bundleRoot\portable\Bezgrow-windows-${{ matrix.arch }}-portable.exe" release-artifacts
          Copy-Item "$bundleRoot\portable\Bezgrow-windows-${{ matrix.arch }}-portable.zip" release-artifacts
          "${{ steps.signing.outputs.status }}" |
            Set-Content "release-artifacts\windows-signing-status.txt"
          $version = node -p "require('./package.json').version"
          node scripts/verify-release-artifact.mjs `
            --file "release-artifacts\Bezgrow-windows-${{ matrix.arch }}-setup.exe" `
            --platform windows `
            --architecture "${{ matrix.arch }}" `
            --version $version
          node scripts/verify-release-artifact.mjs `
            --file "release-artifacts\Bezgrow-windows-${{ matrix.arch }}.msi" `
            --platform windows `
            --architecture "${{ matrix.arch }}" `
            --version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Installers And Download Manifest
    runs-on: ubuntu-latest
    needs:
      - mac
      - windows
    if: >-
      always() &&
      !cancelled() &&
      (needs.mac.result == 'success' || needs.windows.result == 'success')
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$PACKAGE_VERSION"
          fi
          VERSION="${VERSION#v}"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested release version $VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release trust labels
        id: trust
        shell: bash
        run: |
          PRODUCTION_TRUSTED=true
          if [ -f "release-artifacts/mac/mac-signing-status.txt" ]; then
            MAC_SIGNED="$(tr -d '\r\n' < release-artifacts/mac/mac-signing-status.txt)"
            MAC_NOTARIZED="$(tr -d '\r\n' < release-artifacts/mac/mac-notarization-status.txt)"
            if [ "$MAC_SIGNED" != "true" ] || [ "$MAC_NOTARIZED" != "true" ]; then
              PRODUCTION_TRUSTED=false
              echo "The macOS artifact is an internal/testing build and is not notarized." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          shopt -s nullglob
          WINDOWS_DIRS=(release-artifacts/windows-*)
          for WINDOWS_DIR in "${WINDOWS_DIRS[@]}"; do
            STATUS_FILE="$WINDOWS_DIR/windows-signing-status.txt"
            ARCHITECTURE="${WINDOWS_DIR##*-}"
            if [ ! -f "$STATUS_FILE" ]; then
              PRODUCTION_TRUSTED=false
              echo "Windows $ARCHITECTURE signing status is missing; treating it as internal/testing." >> "$GITHUB_STEP_SUMMARY"
            else
              SIGNING_STATUS="$(tr -d '\r\n' < "$STATUS_FILE")"
              if [ "$SIGNING_STATUS" != "valid" ]; then
                PRODUCTION_TRUSTED=false
                echo "Windows $ARCHITECTURE is an internal/testing build because Authenticode credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          VERSION="${{ steps.release.outputs.version }}"
          if [ "$PRODUCTION_TRUSTED" = "true" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=internal" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION-internal.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release checksums
        shell: bash
        run: |
          find release-artifacts -type f ! -name 'SHA256SUMS.txt' -print0 |
            sort -z |
            xargs -0 sha256sum > release-artifacts/SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        run: |
          TAG="${{ steps.trust.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ steps.trust.outputs.prerelease }}" = "true" ]; then
              gh release create "$TAG" --prerelease --title "Bezgrow $VERSION internal/testing" --notes "Integrity-verified internal/testing desktop installers. Operating-system trust warnings may appear for unsigned or unnotarized artifacts."
            else
              gh release create "$TAG" --title "Bezgrow $VERSION" --notes "Integrity-verified, production-trusted Bezgrow desktop installers."
            fi
          fi
          mapfile -d '' ASSETS < <(
            find release-artifacts -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.msix' -o -name '*.zip' -o -name 'SHA256SUMS.txt' \) \
              -print0
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - name: Write download manifest
        shell: bash
        run: |
          TAG="${{ steps.trust.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BASE_URL="https://github.com/$REPOSITORY/releases/download/$TAG"
          MANIFEST_ARGS=(--version "$VERSION" --replace true)
          if [ -f "release-artifacts/mac/Bezgrow-mac.dmg" ]; then
            MAC_ARCHITECTURE="$(cat release-artifacts/mac/mac-architecture.txt)"
            MAC_SIGNED="$(tr -d '\r\n' < release-artifacts/mac/mac-signing-status.txt)"
            MAC_NOTARIZED="$(tr -d '\r\n' < release-artifacts/mac/mac-notarization-status.txt)"
            MAC_CHANNEL="internal"
            if [ "$MAC_SIGNED" = "true" ] && [ "$MAC_NOTARIZED" = "true" ]; then
              MAC_CHANNEL="stable"
            fi
            MANIFEST_ARGS+=(
              --mac-url "$BASE_URL/Bezgrow-mac.dmg"
              --mac-file "release-artifacts/mac/Bezgrow-mac.dmg"
              --mac-architecture "$MAC_ARCHITECTURE"
              --mac-signed "$MAC_SIGNED"
              --mac-notarized "$MAC_NOTARIZED"
              --mac-channel "$MAC_CHANNEL"
            )
          fi
          if [ -f "release-artifacts/windows-x64/Bezgrow-windows-x64-setup.exe" ]; then
            WINDOWS_SIGNING="$(tr -d '\r\n' < release-artifacts/windows-x64/windows-signing-status.txt)"
            WINDOWS_SIGNED=false
            WINDOWS_CHANNEL=internal
            if [ "$WINDOWS_SIGNING" = "valid" ]; then
              WINDOWS_SIGNED=true
              WINDOWS_CHANNEL=stable
            fi
            MANIFEST_ARGS+=(
              --windows-url "$BASE_URL/Bezgrow-windows-x64-setup.exe"
              --windows-file "release-artifacts/windows-x64/Bezgrow-windows-x64-setup.exe"
              --windows-signed "$WINDOWS_SIGNED"
              --windows-channel "$WINDOWS_CHANNEL"
            )
          fi
          if [ -f "release-artifacts/windows-x64/Bezgrow-windows-x64.msi" ]; then
            WINDOWS_SIGNING="$(tr -d '\r\n' < release-artifacts/windows-x64/windows-signing-status.txt)"
            WINDOWS_SIGNED=false
            WINDOWS_CHANNEL=internal
            if [ "$WINDOWS_SIGNING" = "valid" ]; then
              WINDOWS_SIGNED=true
              WINDOWS_CHANNEL=stable
            fi
            MANIFEST_ARGS+=(
              --windows-msi-url "$BASE_URL/Bezgrow-windows-x64.msi"
              --windows-msi-file "release-artifacts/windows-x64/Bezgrow-windows-x64.msi"
              --windows-msi-signed "$WINDOWS_SIGNED"
              --windows-msi-channel "$WINDOWS_CHANNEL"
            )
          fi
          if [ -f "release-artifacts/windows-arm64/Bezgrow-windows-arm64-setup.exe" ]; then
            WINDOWS_ARM_SIGNING="$(tr -d '\r\n' < release-artifacts/windows-arm64/windows-signing-status.txt)"
            WINDOWS_ARM_SIGNED=false
            WINDOWS_ARM_CHANNEL=internal
            if [ "$WINDOWS_ARM_SIGNING" = "valid" ]; then
              WINDOWS_ARM_SIGNED=true
              WINDOWS_ARM_CHANNEL=stable
            fi
            MANIFEST_ARGS+=(
              --windows-arm64-url "$BASE_URL/Bezgrow-windows-arm64-setup.exe"
              --windows-arm64-file "release-artifacts/windows-arm64/Bezgrow-windows-arm64-setup.exe"
              --windows-arm64-signed "$WINDOWS_ARM_SIGNED"
              --windows-arm64-channel "$WINDOWS_ARM_CHANNEL"
            )
          fi
          if [ -f "release-artifacts/windows-arm64/Bezgrow-windows-arm64.msi" ]; then
            WINDOWS_ARM_SIGNING="$(tr -d '\r\n' < release-artifacts/windows-arm64/windows-signing-status.txt)"
            WINDOWS_ARM_SIGNED=false
            WINDOWS_ARM_CHANNEL=internal
            if [ "$WINDOWS_ARM_SIGNING" = "valid" ]; then
              WINDOWS_ARM_SIGNED=true
              WINDOWS_ARM_CHANNEL=stable
            fi
            MANIFEST_ARGS+=(
              --windows-arm64-msi-url "$BASE_URL/Bezgrow-windows-arm64.msi"
              --windows-arm64-msi-file "release-artifacts/windows-arm64/Bezgrow-windows-arm64.msi"
              --windows-arm64-msi-signed "$WINDOWS_ARM_SIGNED"
              --windows-arm64-msi-channel "$WINDOWS_ARM_CHANNEL"
            )
          fi
          node scripts/write-desktop-release-manifest.mjs "${MANIFEST_ARGS[@]}"

      - name: Publish integrity-verified control-plane release metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase publication secrets are unavailable. GitHub release URLs and the checked-in manifest were still published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/publish-release-metadata.mjs \
            --manifest public/downloads/desktop-release.json \
            --version "${{ steps.release.outputs.version }}" \
            --build-number "${{ github.run_number }}" \
            --channel "${{ steps.trust.outputs.channel }}"

      - name: Commit manifest
        shell: bash
        run: |
          if git diff --quiet -- public/downloads/desktop-release.json; then
            echo "Download manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/desktop-release.json
          git commit -m "Update desktop download manifest [skip ci]"
          git push
